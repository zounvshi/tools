<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>办公提效工具集成平台</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 99px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ===== 磨玻璃 ===== */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.35) 100%);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
        }
        .dark .glass-panel {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        /* ===== 现代磨玻璃卡片 ===== */
        .modern-card {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.25) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-radius: 1.5rem;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
            box-shadow: 0 12px 32px 0 rgba(31, 38, 135, 0.04), inset 0 1px 1px 0 rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
        }
        .dark .modern-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.3) 100%);
            box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.3), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .modern-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(56, 189, 248, 0.15),
                    transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }
        .dark .modern-card::before {
            background: radial-gradient(600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                    rgba(14, 165, 233, 0.25),
                    transparent 40%);
        }
        .modern-card:hover::before {
            opacity: 1;
        }
        .modern-card:hover {
            transform: translateY(-5px) scale(1.005);
            box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.2), 0 0 20px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .card-inner {
            background: transparent;
            border-radius: 1.5rem;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* ===== 模态框 ===== */
        #modal-overlay,
        #admin-overlay,
        #guide-overlay,
        #about-overlay {
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: opacity 0.3s ease;
        }
        .modal-anime {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .favorite-btn:active {
            transform: scale(0.75);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ===== 标签 ===== */
        .tag-exe {
            color: #0f766e;
            background: rgba(204, 251, 241, 0.8);
            border: 1px solid rgba(13, 148, 136, 0.3);
        }
        .dark .tag-exe {
            color: #2dd4bf;
            background: rgba(20, 83, 45, 0.4);
            border: 1px solid rgba(45, 212, 191, 0.3);
        }
        .tag-web {
            color: #0369a1;
            background: rgba(224, 242, 254, 0.8);
            border: 1px solid rgba(2, 132, 199, 0.3);
        }
        .dark .tag-web {
            color: #38bdf8;
            background: rgba(12, 74, 110, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        @keyframes pulseGlow {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.9;
            }
        }
        .radar-pulse {
            animation: pulseGlow 2s infinite;
        }

        .rich-text-content img {
            max-width: 100%;
            border-radius: 0.75rem;
            margin: 1rem 0;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .rich-text-content h1,
        .rich-text-content h2,
        .rich-text-content h3 {
            color: #0284c7;
            font-weight: bold;
            margin: 1.2rem 0 0.6rem 0;
        }
        .dark .rich-text-content h1,
        .dark .rich-text-content h2,
        .dark .rich-text-content h3 {
            color: #38bdf8;
        }
        .rich-text-content p {
            margin-bottom: 0.8rem;
            line-height: 1.7;
        }
        .rich-text-content ul,
        .rich-text-content ol {
            margin-left: 1.5rem;
            margin-bottom: 0.8rem;
            list-style-type: disc;
        }
        .rich-text-content li {
            margin-bottom: 0.3rem;
        }
        .rich-text-content strong {
            color: #0f172a;
        }
        .dark .rich-text-content strong {
            color: #f8fafc;
        }
        .rich-text-content a {
            color: #0284c7;
            text-decoration: underline;
        }
        .dark .rich-text-content a {
            color: #38bdf8;
        }

        /* ===== 工具图标 ===== */
        .tool-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            overflow: hidden;
            object-fit: cover;
        }
        .dark .tool-icon {
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }
        .modern-card:hover .tool-icon {
            transform: scale(1.04) rotate(-1deg);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }
        .tool-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== 作者样式：灰色小字，无外框 ===== */
        .tool-author {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-top: 0.05rem;
            line-height: 1.3;
        }
        .dark .tool-author {
            color: #64748b;
        }
        .tool-author .at-symbol {
            color: #94a3b8;
        }
        .dark .tool-author .at-symbol {
            color: #64748b;
        }

        /* ===== 卡片头部：图标 + 名称 + 标签 同一行 ===== */
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .card-header .name-area {
            flex: 1;
            min-width: 0;
        }
        .card-header .name-area .tool-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dark .card-header .name-area .tool-name {
            color: #f1f5f9;
        }
        .card-header .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            flex-shrink: 0;
            justify-content: flex-end;
        }
        .card-header .tag-group .tag-exe,
        .card-header .tag-group .tag-web {
            font-size: 0.55rem;
            padding: 0.1rem 0.6rem;
            border-radius: 999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body class="bg-[#eaf4f8] dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 min-h-screen font-sans selection:bg-sky-400/30 antialiased overflow-x-hidden relative text-base transition-colors duration-500">

    <!-- ===== 背景光球 ===== -->
    <div class="fixed top-[-100px] left-[-100px] w-[700px] h-[700px] bg-sky-400/30 dark:bg-sky-600/15 rounded-full blur-[140px] pointer-events-none -z-10 transition-colors duration-500"></div>
    <div class="fixed top-[20%] right-[-100px] w-[750px] h-[750px] bg-purple-400/25 dark:bg-purple-600/15 rounded-full blur-[150px] pointer-events-none -z-10 transition-colors duration-500"></div>
    <div class="fixed bottom-[-100px] left-[30%] w-[650px] h-[650px] bg-indigo-400/20 dark:bg-indigo-600/10 rounded-full blur-[140px] pointer-events-none -z-10 transition-colors duration-500"></div>

    <!-- ===== 页眉 ===== -->
    <header class="max-w-[1600px] mx-auto px-8 pt-10 pb-10 border-b border-slate-300/40 dark:border-slate-800/80 relative">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <span class="bg-slate-900 dark:bg-sky-500 text-white dark:text-slate-950 text-xs font-black tracking-widest px-3 py-1 rounded-lg shadow-md transition-colors">TOOL KIT</span>
                <span ondblclick="triggerAdminLogin()" class="text-slate-600 dark:text-slate-400 text-sm font-mono tracking-wider cursor-default select-none hover:text-slate-900 dark:hover:text-white transition-colors font-medium">高效数字工作流平台</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openAboutModal()" class="flex items-center gap-1.5 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-white/80 dark:border-slate-700/60 text-slate-700 dark:text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm">
                    <span>关于我们</span>
                </button>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-8">
            <div>
                <h1 class="text-5xl md:text-6xl font-black tracking-tight text-slate-900 dark:text-white mb-4">
                    办公提效工具集成
                </h1>
                <p class="text-slate-600 dark:text-slate-400 max-w-2xl text-base leading-relaxed font-normal">
                    聚合高频便携桌面工具（<span class="text-sky-600 dark:text-sky-400 font-bold">.exe</span>）与现代化在线云网页（<span class="text-purple-600 dark:text-purple-400 font-bold">Web</span>），一键秒级启航。
                </p>
            </div>

            <div class="grid grid-cols-3 gap-5 w-full lg:w-auto lg:min-w-[520px]">
                <div class="glass-panel rounded-2xl p-5 text-center relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[3px] bg-sky-500"></div>
                    <div class="text-slate-500 dark:text-slate-400 text-xs mb-1 font-mono tracking-widest uppercase font-bold">Total_Tools</div>
                    <div class="text-4xl font-black text-slate-900 dark:text-white tracking-tight font-mono" id="totalCount">0</div>
                </div>
                <div class="glass-panel rounded-2xl p-5 text-center relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[3px] bg-purple-500"></div>
                    <div class="text-slate-500 dark:text-slate-400 text-xs mb-1 font-mono tracking-widest uppercase font-bold">Dimension</div>
                    <div class="text-4xl font-black text-slate-900 dark:text-white tracking-tight font-mono">02</div>
                </div>
                <div class="glass-panel rounded-2xl p-5 text-center relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[3px] bg-rose-500"></div>
                    <div class="text-slate-500 dark:text-slate-400 text-xs mb-1 font-mono tracking-widest uppercase font-bold">Favorites</div>
                    <div class="text-4xl font-black text-slate-900 dark:text-white tracking-tight font-mono" id="favCount">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== 悬浮工具栏 ===== -->
    <div class="sticky top-4 z-40 max-w-[1600px] mx-auto px-8 transition-all duration-300 pointer-events-none">
        <div class="glass-panel rounded-2xl p-2.5 shadow-lg pointer-events-auto flex flex-col md:flex-row items-center justify-between gap-3">

            <div class="relative w-full md:max-w-md shrink-0">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 dark:text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </span>
                <input type="text" id="searchInput" placeholder="检索工具、用途..."
                class="w-full bg-white/50 dark:bg-slate-900/60 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 rounded-xl pl-10 pr-4 py-2 text-sm font-mono transition-all duration-300 border border-white/60 dark:border-slate-700/50 shadow-inner focus:outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20">
            </div>

            <div class="flex items-center justify-between md:justify-end gap-3 w-full md:w-auto overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1 bg-black/5 dark:bg-white/5 p-1 rounded-xl shrink-0">
                    <button class="filter-btn shrink-0 bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm px-4 py-1.5 rounded-lg text-xs font-bold transition-all" data-type="all">全部</button>
                    <button class="filter-btn shrink-0 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-4 py-1.5 rounded-lg text-xs font-bold transition-all" data-type="exe">.EXE 桌面端</button>
                    <button class="filter-btn shrink-0 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-4 py-1.5 rounded-lg text-xs font-bold transition-all" data-type="html">WEB 在线版</button>
                </div>

                <span class="hidden md:block w-px h-5 bg-slate-300/60 dark:bg-slate-700/60"></span>

                <button id="favToggle" class="flex items-center gap-1.5 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-white/80 dark:border-slate-700/60 text-slate-700 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm shrink-0">
                    <svg id="favToggleIcon" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                    <span id="favToggleText">查看收藏</span>
                </button>

                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="flex items-center justify-center w-9 h-9 bg-white/60 dark:bg-slate-800/60 hover:bg-white dark:hover:bg-slate-800 border border-white/80 dark:border-slate-700/60 text-slate-700 dark:text-slate-300 rounded-xl text-xs transition-all shadow-sm shrink-0" title="切换暗色/浅色主题">
                    <span id="themeIcon">🌙</span>
                </button>

                <button id="adminPanelBtn" onclick="toggleAdminPanel(true)" class="hidden flex items-center gap-1.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md shrink-0">
                    🛠️ 管理员
                </button>
            </div>
        </div>
    </div>

    <!-- ===== 卡片网格 ===== -->
    <main class="max-w-[1600px] mx-auto px-8 pt-10 pb-28">
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-8">
            <!-- JS 动态渲染 -->
        </div>
    </main>

    <!-- ===== 关于我们模态框 ===== -->
    <div id="about-overlay" class="fixed inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4 transition-all">
        <div class="bg-white/95 dark:bg-slate-900/95 border border-white/80 dark:border-slate-800 rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden modal-anime">
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-900/80">
                <div class="flex items-center gap-2.5">
                    <span class="text-2xl">💡</span>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white font-mono">关于本平台</h3>
                </div>
                <button onclick="closeAboutModal()" class="text-slate-500 hover:text-slate-900 dark:hover:text-white bg-slate-200/80 dark:bg-slate-800 rounded-xl p-2 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="about-content-area" class="flex-1 overflow-y-auto p-8 text-slate-700 dark:text-slate-300 text-base leading-relaxed rich-text-content space-y-4">
                <!-- 动态渲染 -->
            </div>
            <div id="adminAboutEditor" class="hidden border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 p-6 space-y-4">
                <div class="flex items-center gap-2 text-purple-600 dark:text-purple-400 text-xs font-mono font-bold">
                    <span class="w-2 h-2 bg-purple-600 rounded-full radar-pulse"></span>
                    管理员编辑模式 · 修改全站「关于我们」
                </div>
                <textarea id="aboutEditorTextarea" rows="6"
                class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl p-4 text-sm font-mono focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-500/20"
                placeholder="支持 HTML 标签..."></textarea>
                <div class="flex justify-between items-center">
                    <p class="text-slate-500 text-xs">💡 可使用 &lt;h2&gt;、&lt;p&gt;、&lt;ul&gt; 等标签</p>
                    <div class="flex gap-3">
                        <button onclick="previewAbout()" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs px-4 py-2.5 rounded-xl font-bold transition-all border border-slate-300 dark:border-slate-700">👁️ 预览</button>
                        <button onclick="saveAboutContent()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs px-5 py-2.5 rounded-xl font-bold shadow-md transition-all">💾 保存信息</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 在线预览模态框 ===== -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 md:p-8 transition-all">
        <div id="modalContainer" class="bg-white/90 dark:bg-slate-900/90 border border-white/80 dark:border-slate-700 shadow-2xl rounded-3xl w-full max-w-7xl h-[88vh] flex flex-col overflow-hidden modal-anime transition-all duration-300">
            <div class="flex flex-wrap justify-between items-center px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md gap-3">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-purple-500 radar-pulse shadow-md shadow-purple-500/80"></span>
                    <h3 class="text-base font-bold text-slate-900 dark:text-white tracking-wide font-mono truncate max-w-[200px] sm:max-w-sm" id="modal-title">SANDBOX_ENVIRONMENT</h3>
                </div>
                <div class="flex items-center gap-2.5">
                    <button id="zoom-modal" onclick="toggleModalSize()" class="text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold rounded-xl text-xs px-4 py-2 border border-slate-300 dark:border-slate-700 transition-all flex items-center gap-1.5">
                        <span id="zoom-icon">🔳</span> <span id="zoom-text">全屏</span>
                    </button>
                    <a id="external-link" href="#" target="_blank" class="text-sky-700 dark:text-sky-400 hover:text-sky-800 bg-sky-50 dark:bg-sky-950/50 hover:bg-sky-100 border border-sky-300 dark:border-sky-800 font-bold rounded-xl text-xs px-4 py-2 transition-all flex items-center gap-1.5">
