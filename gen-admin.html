<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理员密码哈希生成器（本地版，密码不出本机）</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --brand:#6366f1; --ok:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
  .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  .card { background:var(--card); border-radius:14px; padding:20px; margin-top:16px; }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input[type=text], input[type=password] { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #334155; background:#0b1220; color:var(--fg); font-size:15px; }
  button { margin-top:18px; padding:12px 18px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:15px; cursor:pointer; }
  button:active { transform: translateY(1px); }
  .out { margin-top:16px; background:#0b1220; border:1px solid #334155; border-radius:10px; padding:14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size:13px; word-break:break-all; }
  .ok { color:var(--ok); }
  .tip { color:var(--muted); font-size:13px; margin-top:8px; }
  .warn { color:#fbbf24; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 管理员密码哈希生成器</h1>
  <p class="tip">本页面完全在<strong>你自己的浏览器</strong>里运行，密码不会被上传到任何服务器。生成后把结果填到 Cloudflare 的 <code>ADMIN_CREDENTIALS</code> 里即可。</p>

  <div class="card">
    <label>管理员用户名（默认 liyt1）</label>
    <input type="text" id="username" value="liyt1" />

    <label>管理员登录密码（自己定一个，记牢）</label>
    <input type="password" id="password" placeholder="例如：设一个强一点的密码" />

    <button id="gen">生成 ADMIN_CREDENTIALS</button>

    <p class="warn" id="hint" style="display:none;">⚠️ 用户名或密码不能为空。</p>

    <div class="out" id="result" style="display:none;"></div>
    <p class="tip" id="copyTip" style="display:none;">上面这整行就是你要填到 Cloudflare 的值。点一下结果框即可全选复制。</p>
  </div>

  <div class="card">
    <p class="tip">说明：平台只保存密码的「哈希值」（一种单向指纹），不保存密码本身。即使有人拿到这个哈希，也无法反推出你的密码。登录时系统会把你输入的密码现场再算一次哈希来比对。</p>
  </div>
</div>

<script>
// ---- 纯 JS SHA-256（不依赖任何外部库，file:// 直接可用）----
function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
function toUTF8(str) {
  const utf8 = [];
  for (let i = 0; i < str.length; i++) {
    let charcode = str.charCodeAt(i);
    if (charcode < 0x80) utf8.push(charcode);
    else if (charcode < 0x800) { utf8.push(0xc0 | (charcode >> 6), 0x80 | (charcode & 0x3f)); }
    else if (charcode < 0xd800 || charcode >= 0xe000) { utf8.push(0xe0 | (charcode >> 12), 0x80 | ((charcode >> 6) & 0x3f), 0x80 | (charcode & 0x3f)); }
    else { i++; charcode = 0x10000 + (((charcode & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff)); utf8.push(0xf0 | (charcode >> 18), 0x80 | ((charcode >> 12) & 0x3f), 0x80 | ((charcode >> 6) & 0x3f), 0x80 | (charcode & 0x3f)); }
  }
  return utf8;
}
function sha256Hex(msg) {
  const bytes = toUTF8(msg);
  const l = bytes.length, bitLen = l * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0x00);
  const hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
  bytes.push((hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff);
  bytes.push((lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff);
  const k = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  for (let i=0;i<bytes.length;i+=64){
    const w=new Array(64);
    for(let j=0;j<16;j++){ w[j]=(bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|(bytes[i+j*4+3]); }
    for(let j=16;j<64;j++){ const s0=rightRotate(w[j-15],7)^rightRotate(w[j-15],18)^(w[j-15]>>>3); const s1=rightRotate(w[j-2],17)^rightRotate(w[j-2],19)^(w[j-2]>>>10); w[j]=(w[j-16]+s0+w[j-7]+s1)|0; }
    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(let j=0;j<64;j++){ const S1=rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25); const ch=(e&f)^((~e)&g); const t1=(h+S1+ch+k[j]+w[j])|0; const S0=rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22); const maj=(a&b)^(a&c)^(b&c); const t2=(S0+maj)|0; h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0; }
    h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+h)|0;
  }
  const hex=(n)=>(n>>>0).toString(16).padStart(8,'0');
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(hex).join('');
}

document.getElementById('gen').addEventListener('click', function () {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  const copyTip = document.getElementById('copyTip');
  if (!user || !pass) { hint.style.display = 'block'; result.style.display='none'; copyTip.style.display='none'; return; }
  hint.style.display = 'none';
  const hash = sha256Hex(pass);
  const json = '[{"user":"' + user + '","hash":"' + hash + '"}]';
  result.textContent = json;
  result.style.display = 'block';
  copyTip.style.display = 'block';
});
document.getElementById('result').addEventListener('click', function () {
  const range = document.createRange(); range.selectNodeContents(this);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  try { document.execCommand('copy'); } catch(e) {}
});
</script>
</body>
</html>
