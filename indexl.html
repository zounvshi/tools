<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办公提效工具集成平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 优化滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #070a13; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
        
        /* 数码像素网格背景特效 */
        .digital-grid {
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
        }

        /* 流光跑马灯卡片 */
        .modern-card {
            position: relative;
            background: rgba(11, 19, 43, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* 流光核心层 */
        .modern-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1rem;
            background: conic-gradient(from 0deg, transparent 30%, #38bdf8, #a855f7, transparent 70%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: rotateGlow 3s linear infinite;
        }

        .modern-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: transparent;
            box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.3);
        }

        .modern-card:hover::after {
            opacity: 1;
        }

        /* 确保内部容器遮罩流光中心 */
        .card-inner {
            background: rgba(9, 15, 35, 0.93);
            border-radius: 0.95rem;
            height: 100%;
            width: 100%;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #modal-overlay, #admin-overlay {
            backdrop-filter: blur(20px);
            transition: opacity 0.3s ease;
        }
        .modal-anime {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(40px) scale(0.96); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .favorite-btn:active { transform: scale(0.75); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 科技风电子发光标签样式 */
        .cyber-tag-blue {
            color: #38bdf8;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.4);
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
            box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.2);
        }
        .cyber-tag-purple {
            color: #c084fc;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(192, 132, 252, 0.4);
            text-shadow: 0 0 6px rgba(192, 132, 252, 0.8);
            box-shadow: inset 0 0 8px rgba(192, 132, 252, 0.2);
        }

        /* 仪表盘呼吸灯 */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        .radar-pulse {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="bg-[#02050e] text-gray-100 min-h-screen font-sans selection:bg-sky-500/30 antialiased overflow-x-hidden digital-grid relative">

    <!-- 背景科幻光晕 -->
    <div class="absolute top-0 left-1/4 w-[600px] h-[600px] bg-sky-500/5 rounded-full blur-[150px] pointer-events-none -z-10"></div>
    <div class="absolute top-40 right-1/4 w-[500px] h-[500px] bg-purple-500/5 rounded-full blur-[150px] pointer-events-none -z-10"></div>

    <!-- 页眉区 -->
    <header class="max-w-7xl mx-auto px-6 pt-12 pb-8 border-b border-sky-950/40 relative">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <div class="flex items-center gap-2.5 mb-3">
                    <span class="bg-gradient-to-r from-sky-500 to-blue-600 text-slate-950 text-[10px] font-black tracking-wider px-2.5 py-0.5 rounded-md shadow-lg shadow-sky-500/20">TOOL KIT</span>
                    <span ondblclick="triggerAdminLogin()" class="text-slate-600 text-xs font-mono tracking-wider cursor-default select-none hover:text-sky-400/70 transition-colors">高效数字工作流平台（双击验证内网密匙）</span>
                </div>
                <h1 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent mb-4">
                    办公提效工具集成
                </h1>
                <p class="text-slate-400 max-w-xl text-sm leading-relaxed font-light">
                    聚合高频便携桌面工具（<span class="text-sky-400 font-medium">.exe</span>）与现代化在线云网页（<span class="text-purple-400 font-medium">Web</span>），一键秒级启航。
                </p>
            </div>
            
            <!-- 仪表盘概念统计面板 -->
            <div class="grid grid-cols-3 gap-4 w-full md:w-auto md:min-w-[420px]">
                <div class="bg-slate-950/80 border border-sky-950/50 rounded-xl p-4 text-center backdrop-blur-sm relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[2px] bg-sky-500/30"></div>
                    <div class="text-slate-500 text-[10px] mb-1 font-mono tracking-widest uppercase">Total_Tools</div>
                    <div class="text-3xl font-black text-white tracking-tight font-mono" id="totalCount">0</div>
                </div>
                <div class="bg-slate-950/80 border border-purple-950/50 rounded-xl p-4 text-center backdrop-blur-sm relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[2px] bg-purple-500/30"></div>
                    <div class="text-slate-500 text-[10px] mb-1 font-mono tracking-widest uppercase">Dimension</div>
                    <div class="text-3xl font-black bg-gradient-to-r from-sky-400 to-purple-400 bg-clip-text text-transparent tracking-tight font-mono">02</div>
                </div>
                <div class="bg-slate-950/80 border border-rose-950/50 rounded-xl p-4 text-center backdrop-blur-sm relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-full h-[2px] bg-rose-500/30"></div>
                    <div class="text-slate-500 text-[10px] mb-1 font-mono tracking-widest uppercase">Favorites</div>
                    <div class="text-3xl font-black text-rose-400 tracking-tight font-mono" id="favCount">0</div>
                </div>
            </div>
        </div>
    </header>

    <!-- 粘性吸顶工具栏 -->
    <div class="sticky top-0 z-40 bg-[#02050e]/80 backdrop-blur-md border-b border-sky-950/30 shadow-2xl shadow-slate-950/50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- 搜索区 -->
            <div class="relative w-full md:max-w-md shrink-0">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-sky-400/60 group-focus-within:text-sky-400 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" id="searchInput" placeholder="检索终端元件编号、用途或技术栈..." 
                       class="w-full bg-slate-950/90 text-slate-200 placeholder-slate-600 rounded-xl pl-11 pr-4 py-2.5 text-sm font-mono transition-all duration-300
                              border border-sky-500/30 shadow-[inset_0_0_12px_rgba(56,189,248,0.06),0_0_8px_rgba(56,189,248,0.03)]
                              hover:border-sky-500/50 hover:shadow-[inset_0_0_12px_rgba(56,189,248,0.1),0_0_12px_rgba(56,189,248,0.08)]
                              focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400/40 focus:shadow-[inset_0_0_16px_rgba(56,189,248,0.15),0_0_20px_rgba(56,189,248,0.2)]">
            </div>
            
            <!-- 环境筛选与功能聚合 -->
            <div class="flex items-center justify-between md:justify-end gap-3 w-full md:w-auto overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1.5 bg-slate-950/60 p-1 rounded-xl border border-sky-950/40 shrink-0">
                    <button class="filter-btn shrink-0 bg-sky-500 text-slate-950 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow-md shadow-sky-500/20" data-type="all">全部工具</button>
                    <button class="filter-btn shrink-0 text-slate-400 hover:text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all" data-type="exe">.EXE 桌面端</button>
                    <button class="filter-btn shrink-0 text-slate-400 hover:text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all" data-type="html">WEB 在线版</button>
                </div>
                
                <span class="hidden md:block w-px h-5 bg-sky-950/60"></span>

                <button id="favToggle" class="flex items-center gap-1.5 bg-slate-950/80 hover:bg-slate-900 border border-sky-950/40 text-slate-400 hover:text-rose-400 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all shrink-0">
                    <svg id="favToggleIcon" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                    <span id="favToggleText">查看收藏</span>
                </button>

                <button id="adminPanelBtn" onclick="toggleAdminPanel(true)" class="hidden flex items-center gap-1 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white border border-purple-500/30 px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-lg shrink-0">
                    🛠️ 管理员面板
                </button>
            </div>
        </div>
    </div>

    <!-- 主体卡片网格区 -->
    <main class="max-w-7xl mx-auto px-6 pt-8 pb-24">
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS 动态渲染 -->
        </div>
    </main>

    <!-- 在线预览模态框 -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex items-center justify-center p-2 md:p-6 transition-all">
        <div id="modalContainer" class="bg-[#090f23] border border-sky-500/30 rounded-2xl shadow-2xl w-full max-w-6xl h-[85vh] flex flex-col overflow-hidden modal-anime transition-all duration-300">
            <div class="flex flex-wrap justify-between items-center px-4 py-3 border-b border-sky-950/60 bg-slate-950/40 backdrop-blur-sm gap-2">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-purple-500 radar-pulse shadow-md shadow-purple-500/80"></span>
                    <h3 class="text-sm font-bold text-white tracking-wide font-mono truncate max-w-[180px] sm:max-w-xs" id="modal-title">SANDBOX_ENVIRONMENT</h3>
                </div>
                <div class="flex items-center gap-2">
                    <button id="zoom-modal" onclick="toggleModalSize()" class="text-slate-300 hover:text-white bg-slate-900 hover:bg-slate-800 font-bold rounded-lg text-xs px-3 py-1.5 border border-sky-950/60 transition-all flex items-center gap-1">
                        <span id="zoom-icon">🔳</span> <span id="zoom-text">全屏</span>
                    </button>
                    <a id="external-link" href="#" target="_blank" class="text-sky-400 hover:text-sky-300 bg-sky-950/40 hover:bg-sky-900/60 border border-sky-800/30 font-bold rounded-lg text-xs px-3 py-1.5 transition-all flex items-center gap-1">
                        浏览器查看
                    </a>
                    <button id="close-modal" class="text-rose-400 hover:text-white bg-slate-900 hover:bg-rose-950/60 font-bold rounded-lg text-xs px-3 py-1.5 border border-rose-950/40 transition-all">
                        ✕ 关闭
                    </button>
                </div>
            </div>
            <div class="flex-grow bg-slate-950 relative">
                <div class="absolute inset-0 flex items-center justify-center text-slate-600 text-xs font-mono gap-2 pointer-events-none">
                    <svg class="animate-spin h-4 w-4 text-sky-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    CRADLE_SYSTEM LOADING...
                </div>
                <iframe id="preview-iframe" src="" class="w-full h-full border-none relative z-10"></iframe>
            </div>
        </div>
    </div>

    <!-- 管理员控制面板 -->
    <div id="admin-overlay" class="fixed inset-0 bg-slate-950/90 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0b132b] border border-purple-500/30 rounded-2xl shadow-2xl w-full max-w-lg p-6 modal-anime">
            <div class="flex justify-between items-center mb-5 border-b border-purple-950/60 pb-3">
                <h3 class="text-base font-bold text-white flex items-center gap-2 font-mono">🛠️ CORE_DATAPACK_DEPLOY</h3>
                <button onclick="toggleAdminPanel(false)" class="text-slate-400 hover:text-white text-sm">✕</button>
            </div>
            
            <form id="toolForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 font-mono">元件分流协议</label>
                    <select id="toolType" onchange="adaptFormType()" class="w-full bg-slate-950 border border-purple-950 text-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-500">
                        <option value="html">Web 在线网页版 (填写URL链接)</option>
                        <option value="exe">.exe 桌面端软件 (填写下载链接)</option>
                        <option value="code">HTML 独立代码块 (直接贴入前端源码)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 font-mono">元件别称 *</label>
                    <input type="text" id="toolName" required placeholder="如：系统大屏协同终端" class="w-full bg-slate-950 border border-purple-950 text-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 font-mono">描述指令 *</label>
                    <textarea id="toolDesc" required rows="2" placeholder="简要阐述核心用途..." class="w-full bg-slate-950 border border-purple-950 text-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-500"></textarea>
                </div>
                <div id="urlInputContainer">
                    <label id="urlLabel" class="block text-xs font-bold text-slate-400 mb-1 font-mono">分发地址链路 *</label>
                    <input type="text" id="toolUrl" placeholder="https://..." class="w-full bg-slate-950 border border-purple-950 text-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 font-mono">归类技术标签 (用逗号隔开)</label>
                    <input type="text" id="toolTags" placeholder="效率, 数字化" class="w-full bg-slate-950 border border-purple-950 text-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div class="pt-2 flex flex-wrap justify-end gap-2 border-t border-purple-950/60 pt-4">
                    <button type="button" onclick="logoutAdmin()" class="bg-rose-950/40 text-rose-400 hover:bg-rose-900 border border-rose-950 text-xs px-2.5 py-2 rounded-lg font-semibold mr-auto">注销</button>
                    <button type="button" onclick="exportNewJson()" class="bg-emerald-950/40 text-emerald-400 hover:bg-emerald-900 border border-emerald-950 text-xs px-3 py-2 rounded-lg font-bold shadow-md">📦 导出新配置</button>
                    <button type="button" onclick="resetFormToDefault()" class="bg-slate-900 hover:bg-slate-800 text-slate-400 text-xs px-3 py-2 rounded-lg font-semibold">重置初版</button>
                    <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs px-4 py-2 rounded-lg font-bold shadow-md active:scale-95 transition-all">上架工具</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "123456";
        let isAdmin = false; 

        // 本地降级容灾兜底数据
        const defaultTools = [
            { id: 1, name: "MouseFX", desc: "一款轻量酷炫的鼠标特效增强工具，为您在录屏、演示及日常办公时提供极佳的指针视觉反馈。", type: "exe", favorite: false, tags: ["桌面美化", "演示提效"], url: "#" },
            { id: 2, name: "医药法规数字化协同平台", desc: "专为医药行业打造的数字化合规与政策标准协同查询系统，支持云端高效在线查阅与多方联控。", type: "html", favorite: false, tags: ["行业协同", "合规数字化"], url: "https://zounvshi.github.io/zhiliang" }
        ];

        let toolsData = [];
        const grid = document.getElementById('cardGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalCount = document.getElementById('totalCount');
        const favCount = document.getElementById('favCount');
        const favToggle = document.getElementById('favToggle');
        const favToggleText = document.getElementById('favToggleText');
        const favToggleIcon = document.getElementById('favToggleIcon');
        let isFavViewActive = false; 

        const modal = document.getElementById('modal-overlay');
        const modalContainer = document.getElementById('modalContainer');
        const modalTitle = document.getElementById('modal-title');
        const previewIframe = document.getElementById('preview-iframe');
        const closeModalBtn = document.getElementById('close-modal');
        const externalLink = document.getElementById('external-link');
        let isModalMaximized = false;

        function checkAdminSession() {
            if (sessionStorage.getItem('isAdminActive') === 'true') {
                isAdmin = true;
                document.getElementById('adminPanelBtn').classList.remove('hidden');
            }
        }

        function triggerAdminLogin() {
            const pass = prompt("验证核心内网管理员密匙：");
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                sessionStorage.setItem('isAdminActive', 'true');
                document.getElementById('adminPanelBtn').classList.remove('hidden');
                alert("内网凭证已激活！");
                renderTools(getActiveFilterType(), searchInput.value); 
            } else if (pass !== null) {
                alert("校验失败，终端已锁定保护！");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            sessionStorage.removeItem('isAdminActive');
            document.getElementById('adminPanelBtn').classList.add('hidden');
            toggleAdminPanel(false);
            alert("内网凭证已安全注销。");
            renderTools(getActiveFilterType(), searchInput.value);
        }

        // 🌟 【同步核心升级】：异步读取线上同级目录下的 tools.json
        async function initData() {
            checkAdminSession();
            try {
                const response = await fetch('./tools.json');
                if (!response.ok) throw new Error('网络元件文件读取失败');
                toolsData = await response.json();
            } catch (error) {
                console.warn("未检索到线上 tools.json，正启用本地存储或默认拓扑:", error);
                const localData = localStorage.getItem('customToolsData');
                if (localData) {
                    toolsData = JSON.parse(localData);
                } else {
                    toolsData = [...defaultTools];
                    localStorage.setItem('customToolsData', JSON.stringify(toolsData));
                }
            }
            loadFavorites();
            renderTools();
        }

        function loadFavorites() {
            const stored = localStorage.getItem('favTools');
            if (stored) {
                const favIds = JSON.parse(stored);
                toolsData.forEach(item => {
                    item.favorite = favIds.includes(item.id);
                });
            }
        }

        function saveFavorites() {
            const favIds = toolsData.filter(item => item.favorite).map(item => item.id);
            localStorage.setItem('favTools', JSON.stringify(favIds));
        }

        function syncToLocalStorage() {
            localStorage.setItem('customToolsData', JSON.stringify(toolsData));
        }

        function toggleAdminPanel(show) {
            document.getElementById('admin-overlay').classList.toggle('hidden', !show);
        }

        function adaptFormType() {
            const type = document.getElementById('toolType').value;
            const label = document.getElementById('urlLabel');
            const input = document.getElementById('toolUrl');
            if(type === 'code') {
                label.innerText = "直接粘贴完整 HTML 源码块 *";
                input.placeholder = "例：<div class='p-4'><h3>自定义</h3></div>...";
            } else if (type === 'exe') {
                label.innerText = "软件云盘下载链接 *";
                input.placeholder = "https://pan.baidu.com/...";
            } else {
                label.innerText = "网页在线访问地址 (URL) *";
                input.placeholder = "https://...";
            }
        }

        function handleUpload(e) {
            e.preventDefault();
            if(!isAdmin) return;
            const type = document.getElementById('toolType').value;
            const name = document.getElementById('toolName').value;
            const desc = document.getElementById('toolDesc').value;
            let url = document.getElementById('toolUrl').value;
            const tagsInput = document.getElementById('toolTags').value;
            const tags = tagsInput ? tagsInput.split(/[,，]/).map(t => t.trim()) : ["CUSTOM"];
            
            if(type === 'code') {
                const blob = new Blob([url], { type: 'text/html' });
                url = URL.createObjectURL(blob);
            }

            const newTool = { id: Date.now(), name, desc, type: type === 'code' ? 'html' : type, favorite: false, tags, url: url || "#" };
            toolsData.push(newTool);
            syncToLocalStorage();
            alert("上架成功！由于网页在静态托管平台运行，如需同步给所有人，请务必点击面板中的【📦 导出新配置】并覆盖 GitHub 的 tools.json。");
            document.getElementById('toolForm').reset();
            renderTools(getActiveFilterType(), searchInput.value);
        }

        // 🌟 【新增导出】：将当前内存中最新添加的数据，导出为纯净的 JSON 供更新使用
        function exportNewJson() {
            const cleanData = toolsData.map(({favorite, ...rest}) => ({...rest, favorite: false}));
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "tools.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function deleteTool(id) {
            if(!isAdmin) return;
            if(confirm("执行下架并彻底擦除该元件？")) {
                toolsData = toolsData.filter(t => t.id !== id);
                syncToLocalStorage();
                saveFavorites();
                renderTools(getActiveFilterType(), searchInput.value);
            }
        }

        function resetFormToDefault() {
            if(confirm("重置整个阵列恢复至出厂拓扑？")) {
                localStorage.removeItem('customToolsData');
                initData();
                toggleAdminPanel(false);
                renderTools('all', '');
            }
        }

        function openModal(name, url) {
            modalTitle.innerText = `[CONNECTED] // ${name.toUpperCase()}`;
            previewIframe.src = url; 
            externalLink.href = url;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function toggleModalSize() {
            const zIcon = document.getElementById('zoom-icon');
            const zText = document.getElementById('zoom-text');
            isModalMaximized = !isModalMaximized;
            if(isModalMaximized) {
                modalContainer.classList.remove('max-w-6xl', 'h-[85vh]');
                modalContainer.classList.add('max-w-full', 'h-screen', 'rounded-none');
                zIcon.innerText = "💠"; zText.innerText = "视窗复原";
            } else {
                modalContainer.classList.remove('max-w-full', 'h-screen', 'rounded-none');
                modalContainer.classList.add('max-w-6xl', 'h-[85vh]');
                zIcon.innerText = "🔳"; zText.innerText = "全屏";
            }
        }

        closeModalBtn.onclick = () => {
            modal.classList.add('hidden');
            previewIframe.src = '';
            document.body.style.overflow = 'auto';
            if(isModalMaximized) toggleModalSize();
        }

        function toggleFavorite(id) {
            const item = toolsData.find(t => t.id === id);
            if (!item) return;
            item.favorite = !item.favorite;
            saveFavorites();
            favCount.innerText = toolsData.filter(i => i.favorite).length;
            const btn = document.querySelector(`.favorite-btn[data-id="${id}"]`);
            if (btn) {
                const svg = btn.querySelector('svg');
                if (item.favorite) {
                    svg.classList.remove('text-slate-500', 'hover:text-rose-400');
                    svg.classList.add('text-rose-500', 'fill-rose-500', 'scale-110');
                } else {
                    svg.classList.remove('text-rose-500', 'fill-rose-500', 'scale-110');
                    svg.classList.add('text-slate-500', 'hover:text-rose-400');
                }
            }
            if (isFavViewActive && !item.favorite) renderTools(getActiveFilterType(), searchInput.value);
        }

        function getActiveFilterType() {
            if (isFavViewActive) return 'favorite';
            const active = document.querySelector('.filter-btn.bg-sky-500');
            return active ? active.dataset.type : 'all';
        }

        function renderTools(filterType = 'all', keyword = '') {
            let filteredData = toolsData;
            if (filterType === 'favorite') {
                filteredData = filteredData.filter(item => item.favorite === true);
            } else if (filterType !== 'all') {
                filteredData = filteredData.filter(item => item.type === filterType);
            }
            if (keyword.trim() !== '') {
                filteredData = filteredData.filter(item => item.name.toLowerCase().includes(keyword.toLowerCase()) || item.desc.toLowerCase().includes(keyword.toLowerCase()));
            }

            favCount.innerText = toolsData.filter(item => item.favorite).length;
            totalCount.innerText = toolsData.length < 10 ? `0${toolsData.length}` : toolsData.length;

            if (filteredData.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-600 font-mono text-xs tracking-wider">NO_MATCHED_COMPONENTS // 无匹配项</div>`;
                return;
            }

            grid.innerHTML = filteredData.map(item => `
                <div class="modern-card p-[1px] group relative">
                    <div class="card-inner p-5 flex flex-col justify-between relative">
                        ${isAdmin ? `
                            <button onclick="deleteTool(${item.id})" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 bg-slate-950/90 hover:bg-rose-950 text-slate-500 hover:text-rose-400 transition-all px-2 py-0.5 text-[9px] font-mono rounded border border-rose-950/60 z-20" title="擦除此元件">✕ WIPE</button>
                        ` : ''}
                        
                        <div>
                            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-3.5 ${isAdmin ? 'pr-12' : ''}">
                                <h3 class="text-base font-bold text-slate-100 tracking-tight font-sans">${item.name}</h3>
                                <div class="flex flex-wrap gap-1.5 shrink-0 sm:justify-end">
                                    ${item.tags.map(tag => {
                                        const glowClass = (item.type === 'exe') ? 'cyber-tag-blue' : 'cyber-tag-purple';
                                        return `<span class="${glowClass} text-[9px] px-2 py-0.5 rounded font-mono tracking-wide transition-all duration-300 uppercase">${tag}</span>`;
                                    }).join('')}
                                </div>
                            </div>
                            <div class="text-slate-400 text-xs leading-relaxed mb-6 font-light">${item.desc}</div>
                        </div>
                        
                        <div class="flex items-center justify-between pt-4 border-t border-sky-950/40">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleFavorite(${item.id})" class="favorite-btn p-1.5 bg-slate-950/80 hover:bg-slate-900 rounded-lg border border-sky-950/40 transition-all focus:outline-none" data-id="${item.id}">
                                    <svg class="w-4 h-4 transition-all duration-200 ${item.favorite ? 'text-rose-500 fill-rose-500 scale-110' : 'text-slate-500 hover:text-rose-400'}" viewBox="0 0 24 24" fill="${item.favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                                    </svg>
                                </button>
                                <span class="px-2 py-0.5 text-[9px] font-black font-mono rounded ${item.type === 'exe' ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20 shadow-[0_0_10px_rgba(56,189,248,0.1)]' : 'bg-purple-500/10 text-purple-400 border border-purple-500/20 shadow-[0_0_10px_rgba(168,85,247,0.1)]'}">${item.type === 'exe' ? 'EXE' : 'WEB'}</span>
                            </div>
                            
                            <div>
                                ${item.type === 'exe' ? `
                                    <a href="${item.url}" onclick="if(this.getAttribute('href')==='#'){alert('请管理员上传配置本卡片的真实软件下载直链！');return false;}" class="inline-block bg-gradient-to-r from-sky-400 to-blue-500 text-slate-950 text-xs font-bold px-4 py-1.5 rounded-xl hover:from-white hover:to-white shadow-lg shadow-sky-500/10 active:scale-95 transition-all duration-300">下载软件</a>
                                ` : `
                                    <button onclick="openModal('${item.name}', '${item.url}')" class="bg-slate-900 hover:bg-slate-800 text-sky-400 text-xs font-bold px-4 py-1.5 rounded-xl border border-sky-500/30 shadow-md active:scale-95 transition-all duration-300">在线使用</button>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        favToggle.addEventListener('click', function() {
            isFavViewActive = !isFavViewActive;
            if (isFavViewActive) {
                favToggleText.innerText = '返回全部';
                favToggleIcon.classList.add('text-rose-500', 'fill-rose-500/20', 'rotate-180');
                filterBtns.forEach(b => b.className = "filter-btn shrink-0 text-slate-400 hover:text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all");
                renderTools('favorite', searchInput.value);
            } else {
                favToggleText.innerText = '查看收藏';
                favToggleIcon.classList.remove('text-rose-500', 'fill-rose-500/20', 'rotate-180');
                document.querySelector('.filter-btn[data-type="all"]').className = "filter-btn shrink-0 bg-sky-500 text-slate-950 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow-md shadow-sky-500/20";
                renderTools('all', searchInput.value);
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                isFavViewActive = false;
                favToggleText.innerText = '查看收藏';
                favToggleIcon.classList.remove('text-rose-500', 'fill-rose-500/20', 'rotate-180');
                filterBtns.forEach(b => b.className = "filter-btn shrink-0 text-slate-400 hover:text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all");
                this.className = "filter-btn shrink-0 bg-sky-500 text-slate-950 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow-md shadow-sky-500/20";
                renderTools(this.dataset.type, searchInput.value);
            });
        });

        searchInput.addEventListener('input', function() {
            renderTools(getActiveFilterType(), this.value);
        });

        modal.onclick = (e) => { if (e.target === modal) closeModalBtn.onclick(); }

        // 异步数据载入启动
        initData();
    </script>
</body>
</html>
